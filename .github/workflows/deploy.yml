name: Publicar en InfinityFree

on:
  push:
    branches: [main]
    paths:
        
      - '*.php'
      - 'assets/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/deploy.py'
      - 'tests/**'

      - '*.php'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/deploy.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Comprobar configuración FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo '::error::Falta el secreto FTP_PASSWORD en Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Validar cambios
        run: |
          python3 -B -m unittest discover -s tests -v
          for file in agregar.php books.php bootstrap.php consulta.php imprimir_acta.php layout.php plantilla_campos.php records.php ver_libro.php; do
            php -l "$file" || exit 1
          done
      - name: Subir cambios por FTPS
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/deploy.py
